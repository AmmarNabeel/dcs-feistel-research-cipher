[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dcs-feistel-research-cipher"
version = "1.0.0"
description = "Reproducible reference implementation and experiments for a 128-bit Feistel research cipher with Dynamic Cross-Swapping."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "DCS Feistel research cipher contributors"}]
dependencies = [
  "cryptography>=42",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "psutil>=5.9",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
